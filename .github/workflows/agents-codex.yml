name: Agents Updater (Codex Action)

on:
  workflow_call:
    inputs:
      mode:
        description: "suggest|apply (currently disabled)"
        required: false
        default: "suggest"
        type: string
      always_include:
        description: "String or block to enforce in AGENTS.md (currently disabled)"
        required: false
        default: "xyz"
        type: string
      model:
        required: false
        default: "gpt-5-codex"
        type: string
      allow_users:
        description: "Comma-separated list of GitHub usernames allowed to trigger apply"
        required: false
        default: ""
        type: string

    secrets:
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: report-disabled-updater
        run: |
          echo "::notice::OpenAI-backed AGENTS.md updates are disabled. No suggestions or edits were made."
          echo "## AGENTS.md updater disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenAI-backed suggestions and apply were disconnected. No AGENTS.md review or edits were performed by this job." >> "$GITHUB_STEP_SUMMARY"
