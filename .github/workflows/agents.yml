name: Agents Updater (Reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "suggest|apply (currently disabled)"
        required: false
        default: "suggest"
        type: string
      always_include:
        description: "String or block to enforce in AGENTS.md (currently disabled)"
        required: false
        default: "xyz"
        type: string
      openai_model:
        required: false
        default: "gpt-5-codex"
        type: string
      openai_base_url:
        required: false
        default: ""
        type: string
      central_repo:
        description: "Repo that hosts this workflow & script (currently disabled)"
        required: false
        default: "your-org/changelog-bot"
        type: string
      central_ref:
        description: "Ref (tag/branch/sha) to check out scripts from (currently disabled)"
        required: false
        default: "v1"
        type: string

    secrets:
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  run:
    name: AGENTS updater disabled (manual review required)
    runs-on: ubuntu-latest
    steps:
      - name: report-disabled-updater
        run: |
          echo "::notice::OpenAI-backed AGENTS.md updates are disabled. No suggestions or edits were made."
          echo "## AGENTS.md updater disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenAI-backed suggestions and apply were disconnected. No AGENTS.md review or edits were performed by this job." >> "$GITHUB_STEP_SUMMARY"
